<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" fill="none">
  <!-- Minimalist 6-DOF Industrial Manipulator Schematic & Kinematic Reference -->
  <g opacity="0.075" stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Base Platform & Datum -->
    <line x1="560" y1="460" x2="840" y2="460" stroke-width="1.5" stroke="#94a3b8" />
    <path d="M 580 460 L 570 475 M 620 460 L 610 475 M 660 460 L 650 475 M 700 460 L 690 475 M 740 460 L 730 475 M 780 460 L 770 475 M 820 460 L 810 475" stroke-width="1" stroke="#64748b" />
    
    <!-- Coordinate Origin Axes (J0) -->
    <circle cx="700" cy="440" r="18" stroke-width="1.5" stroke="#38bdf8" fill="none" />
    <circle cx="700" cy="440" r="4" fill="#38bdf8" />
    <line x1="700" y1="440" x2="700" y2="390" stroke-width="1.5" stroke="#34d399" stroke-dasharray="3 3" />
    <line x1="700" y1="440" x2="750" y2="440" stroke-width="1.5" stroke="#f43f5e" stroke-dasharray="3 3" />
    <text x="708" y="400" fill="#34d399" font-family="monospace" font-size="10" stroke="none">Z₀</text>
    <text x="742" y="432" fill="#f43f5e" font-family="monospace" font-size="10" stroke="none">X₀</text>

    <!-- Link 1 (Base to J1/J2 Shoulder) -->
    <rect x="686" y="360" width="28" height="80" rx="4" stroke-width="1.5" />
    <circle cx="700" cy="350" r="14" stroke-width="1.5" fill="#090d16" />
    <circle cx="700" cy="350" r="3" fill="#38bdf8" />

    <!-- Link 2 (Upper Arm) -->
    <line x1="700" y1="350" x2="610" y2="210" stroke-width="10" stroke="#38bdf8" stroke-opacity="0.3" />
    <line x1="700" y1="350" x2="610" y2="210" stroke-width="1.5" stroke="#38bdf8" />
    
    <!-- Joint 3 (Elbow) -->
    <circle cx="610" cy="210" r="15" stroke-width="1.5" fill="#090d16" />
    <circle cx="610" cy="210" r="4" fill="#38bdf8" />
    <path d="M 595 210 A 15 15 0 0 1 625 210" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Link 3 (Forearm) -->
    <line x1="610" y1="210" x2="490" y2="150" stroke-width="8" stroke="#38bdf8" stroke-opacity="0.3" />
    <line x1="610" y1="210" x2="490" y2="150" stroke-width="1.5" stroke="#38bdf8" />

    <!-- Joint 4 & 5 (Wrist 1 & 2) -->
    <circle cx="490" cy="150" r="11" stroke-width="1.5" fill="#090d16" />
    <circle cx="490" cy="150" r="3" fill="#38bdf8" />
    <line x1="490" y1="150" x2="430" y2="135" stroke-width="1.5" stroke="#38bdf8" />

    <!-- Joint 6 & Tool Flange (TCP) -->
    <circle cx="430" cy="135" r="8" stroke-width="1.5" fill="#090d16" />
    <!-- End Effector Gripper Silhouette -->
    <path d="M 430 135 L 405 130 M 405 120 L 405 140 M 405 120 L 385 122 M 405 140 L 385 138" stroke-width="1.5" stroke="#38bdf8" />

    <!-- Tool Center Point (TCP) Crosshair -->
    <circle cx="380" cy="130" r="5" stroke-width="1" stroke="#34d399" fill="none" />
    <line x1="372" y1="130" x2="388" y2="130" stroke-width="1" stroke="#34d399" />
    <line x1="380" y1="122" x2="380" y2="138" stroke-width="1" stroke="#34d399" />
    <text x="360" y="115" fill="#34d399" font-family="monospace" font-size="11" stroke="none">TCP {O₆}</text>

    <!-- Workspace Kinematic Reach Envelope (faint arcs) -->
    <path d="M 320 460 A 420 420 0 0 1 700 40" stroke-width="1" stroke-dasharray="6 6" stroke="#94a3b8" />
    <path d="M 440 460 A 300 300 0 0 1 700 160" stroke-width="0.75" stroke-dasharray="4 4" stroke="#64748b" />

    <!-- Planned Trajectory Spline Curve with Control Points -->
    <path d="M 280 260 C 320 180, 360 130, 420 132 C 480 134, 530 110, 560 70" stroke-width="1.5" stroke="#34d399" stroke-dasharray="4 4" />
    <circle cx="280" cy="260" r="3" fill="#34d399" />
    <circle cx="340" cy="150" r="2.5" fill="#38bdf8" />
    <circle cx="480" cy="134" r="2.5" fill="#38bdf8" />
    <circle cx="560" cy="70" r="3" fill="#34d399" />
    <text x="235" y="275" fill="#34d399" font-family="monospace" font-size="9" stroke="none">P_start(t₀)</text>
    <text x="565" y="65" fill="#34d399" font-family="monospace" font-size="9" stroke="none">P_target(t_f)</text>

    <!-- Geometric Dimensioning Annotations -->
    <line x1="700" y1="350" x2="800" y2="350" stroke-width="0.75" stroke-dasharray="2 2" stroke="#64748b" />
    <line x1="610" y1="210" x2="800" y2="210" stroke-width="0.75" stroke-dasharray="2 2" stroke="#64748b" />
    <line x1="790" y1="350" x2="790" y2="210" stroke-width="1" stroke="#94a3b8" marker-start="none" marker-end="none" />
    <text x="802" y="285" fill="#94a3b8" font-family="monospace" font-size="10" stroke="none">L₁=450mm</text>

    <!-- Minimalist Technical Title Block in Corner -->
    <g transform="translate(40, 410)">
      <rect x="0" y="0" width="220" height="60" stroke-width="1" stroke="#38bdf8" stroke-opacity="0.4" fill="#090d16" fill-opacity="0.6" />
      <line x1="0" y1="20" x2="220" y2="20" stroke-width="0.75" stroke="#38bdf8" stroke-opacity="0.3" />
      <text x="10" y="14" fill="#94a3b8" font-family="monospace" font-size="8" stroke="none">SYS: 6-DOF KINEMATIC GEOMETRY</text>
      <text x="10" y="34" fill="#f8fafc" font-family="monospace" font-size="9" font-weight="bold" stroke="none">ABB GoFa CRB 15000</text>
      <text x="10" y="48" fill="#64748b" font-family="monospace" font-size="8" stroke="none">SCALE: 1:10 • DH PARAMETRIC MODEL</text>
    </g>

    <!-- Top Left Coordinate Matrix Block -->
    <g transform="translate(50, 50)" font-family="monospace" font-size="8" fill="#64748b" stroke="none">
      <text x="0" y="0">T_0_6 = [ n  s  a  p ]</text>
      <text x="0" y="14">[ r11  r12  r13  Px ]</text>
      <text x="0" y="28">[ r21  r22  r23  Py ]</text>
      <text x="0" y="42">[ r31  r32  r33  Pz ]</text>
      <text x="0" y="56">[  0    0    0   1  ]</text>
    </g>
  </g>
</svg>
